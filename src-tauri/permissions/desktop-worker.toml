[[permission]]
identifier = "allow-desktop-worker-commands"
description = "Allows the frontend to manage the local MAST discovery worker"
commands.allow = [
  "get_desktop_info",
  "get_worker_status",
  "start_worker",
  "stop_worker",
  "update_worker_token",
  "set_active_plan",
  "get_desktop_auth_item",
  "set_desktop_auth_item",
  "remove_desktop_auth_item",
  "return_to_desktop_app",
  "open_external_popup"
]
