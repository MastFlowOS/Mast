[package]
name = "mast-desktop"
version = "1.0.0"
description = "MAST Windows Desktop Host"
authors = ["MAST Team"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "mast_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
