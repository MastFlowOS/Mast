<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MAST IG Reply Bridge</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 300px; padding: 14px; background: #0d121d; color: #e2e8f0; margin: 0; }
      h1 { font-size: 14px; margin: 0 0 6px; }
      p { font-size: 11px; color: #94a3b8; margin: 0 0 10px; line-height: 1.4; }
      label { display: block; font-size: 11px; font-weight: 600; margin: 8px 0 4px; color: #cbd5e1; }
      input, textarea { width: 100%; box-sizing: border-box; background: #161f33; border: 1px solid #29354d; border-radius: 8px; padding: 7px 9px; color: #f8fafc; font-size: 12px; }
      button { margin-top: 10px; width: 100%; padding: 8px; border-radius: 8px; border: 0; background: #4f46e5; color: white; font-weight: 600; font-size: 12px; cursor: pointer; }
      .status { margin-top: 10px; font-size: 11px; color: #34d399; }
    </style>
  </head>
  <body>
    <h1>MAST IG Reply Bridge</h1>
    <p>Paste the config JSON from Mast Settings → Reply Observation, or enter your gateway URL and token.</p>
    <label for="pasteJson">Quick Paste Config JSON (optional)</label>
    <textarea id="pasteJson" rows="3" placeholder='{"apiBaseUrl":"...","token":"..."}'></textarea>
    <label for="apiBaseUrl">MAST Gateway URL</label>
    <input id="apiBaseUrl" placeholder="https://api.your-mast-domain.com" />
    <label for="token">MAST Access Token</label>
    <input id="token" type="password" placeholder="Bearer JWT token" />
    <button id="saveBtn">Save Connection</button>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
