[[permission]]
identifier = "allow-desktop-worker-commands"
description = "Allows the frontend to manage the local MAST discovery worker"
commands.allow = [
  "get_desktop_info",
  "get_worker_status",
  "start_worker",
  "stop_worker",
  "update_worker_token",
  "set_active_plan",
  "get_desktop_auth_item",
  "set_desktop_auth_item",
  "remove_desktop_auth_item",
  "return_to_desktop_app",
  "open_external_popup",
  "get_ig_watcher_status",
  "open_ig_watcher",
  "ensure_ig_watcher_background",
  "refresh_ig_watcher",
  "disconnect_ig_watcher"
]

[[permission]]
identifier = "allow-ig-watcher-report"
description = "Allows only the isolated Instagram watcher webview to forward observed unread DM summaries"
commands.allow = ["report_ig_watcher_state"]
