<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mast — The premium operating system for client acquisition. Verified emails, phone numbers, websites, and Instagram profiles." />
    <meta property="og:title" content="Mast — Sales-ready lead intelligence" />
    <meta property="og:description" content="Multi-channel lead generation built for agencies, freelancers, and growth operators." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      as="image"
      href="/images/mast-wordmark.png"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/mast-hero-nebula.webp"
    />
    <link
      rel="preload"
      as="image"
      href="/images/mast-globe-final.png"
      fetchpriority="high"
    />

    <style>
      body.mast-loading {
        overflow: hidden !important;
      }
      #mast-preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #080b11;
        background: oklch(0.11 0.022 265);
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        opacity: 1;
        visibility: visible;
        transition: opacity 450ms cubic-bezier(0.4, 0, 0.2, 1), visibility 450ms;
      }
      #mast-preloader.mast-preloader-fade {
        opacity: 0;
        pointer-events: none;
      }
      #mast-preloader.mast-preloader-hidden {
        display: none !important;
      }
      .mast-preloader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 2;
      }
      .mast-preloader-brand {
        position: relative;
        display: inline-grid;
        place-items: center;
      }
      .mast-preloader-glow {
        position: absolute;
        inset: -24px;
        background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.28) 0%, rgba(59, 130, 246, 0.1) 45%, transparent 70%);
        filter: blur(16px);
        pointer-events: none;
        animation: mast-preloader-pulse 2.8s ease-in-out infinite;
      }
      .mast-preloader-logo {
        position: relative;
        z-index: 1;
        width: 157px;
        height: 32px;
        aspect-ratio: 972 / 198;
        object-fit: contain;
        display: block;
      }
      .mast-preloader-track {
        width: 140px;
        height: 2px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
        margin-top: 2rem;
      }
      .mast-preloader-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent 0%, #3b82f6 50%, #818cf8 80%, transparent 100%);
        animation: mast-preloader-slide 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .mast-preloader-label {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.7);
        margin-top: 1rem;
      }
      @keyframes mast-preloader-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes mast-preloader-pulse {
        0%, 100% { opacity: 0.6; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.04); }
      }
    </style>

    <!--
      Non-blocking font loading.
      The render-blocking pattern (<link rel="stylesheet">) prevents the browser
      from painting ANYTHING until fonts.googleapis.com responds. If that request
      is slow, blocked by a VPN, privacy tool, corporate firewall, or regional
      restriction — the entire page stays blank indefinitely.

      Fix: load as media="print" (non-blocking), swap to media="all" on load.
      The page renders immediately with the system font stack; Plus Jakarta Sans
      swaps in once the stylesheet arrives. font-display:swap in the URL ensures individual
      glyphs don't block text rendering either.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      />
    </noscript>

    <title>Mast — Client Acquisition OS</title>
  </head>
  <body class="mast-loading">
    <div id="mast-preloader" aria-hidden="true">
      <div class="mast-preloader-inner">
        <div class="mast-preloader-brand">
          <div class="mast-preloader-glow"></div>
          <img
            src="/images/mast-wordmark.png"
            alt="MAST"
            width="157"
            height="32"
            class="mast-preloader-logo"
            draggable="false"
          />
        </div>
        <div class="mast-preloader-track" role="progressbar" aria-label="Loading workspace">
          <div class="mast-preloader-bar"></div>
        </div>
        <div class="mast-preloader-label" id="mast-preloader-label">Initializing workspace</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
